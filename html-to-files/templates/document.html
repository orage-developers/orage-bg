<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Título del documento</title>
<style>
  /* Tamaño y márgenes de página: Chrome los usa para PDF. */
  @page { size: A4; margin: 20mm 18mm; }
  /* Fuente en cada selector: el import DOCX de LibreOffice no hereda de body. */
  body, h1, h2, h3, p, li, td, th { font-family: Arial, Helvetica, sans-serif; color: #111111; }
  body { font-size: 11pt; line-height: 1.4; }
  h1 { font-size: 22pt; margin: 0 0 6pt; }
  h2 { font-size: 15pt; margin: 18pt 0 6pt; }
  h3 { font-size: 12pt; margin: 12pt 0 4pt; }
  p  { margin: 0 0 8pt; }
  table { border-collapse: collapse; width: 100%; margin: 8pt 0; }
  th, td { border: 1px solid #999; padding: 4pt 6pt; text-align: left; vertical-align: top; }
  th { background: #eeeeee; }
  .page-break { page-break-before: always; }
</style>
</head>
<body>
  <h1>Título del documento</h1>
  <p><strong>Fecha:</strong> 2026-01-01 · <strong>Autor:</strong> Nombre</p>

  <h2>1. Sección</h2>
  <p>Párrafo de texto. Usa <strong>negrita</strong>, <em>cursiva</em> y <a href="https://example.com">enlaces</a>.</p>
  <ul>
    <li>Elemento de lista</li>
    <li>Otro elemento</li>
  </ul>

  <h2>2. Tabla</h2>
  <table border="1" cellspacing="0" cellpadding="6" width="100%">
    <thead><tr><th>Concepto</th><th>Cantidad</th></tr></thead>
    <tbody>
      <tr><td>Ejemplo A</td><td>10</td></tr>
      <tr><td>Ejemplo B</td><td>20</td></tr>
    </tbody>
  </table>

  <h2 class="page-break">3. Nueva página</h2>
  <p>Contenido tras salto de página.</p>
</body>
</html>
