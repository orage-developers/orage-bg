<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data</title>
<!-- Blank data starter: two sheets, number/text types, formulas, total row. XLSX, CSV and PDF. -->
<style>
  /* Styling only affects the PDF of this HTML. XLSX and CSV read the tables.
     ORAGE brand: colors per rules/brand.md, fonts and voice per BRAND-GUIDELINES.md. */
  @font-face { font-family: "Bebas Neue"; src: url("brand://fonts/BebasNeue-Regular.ttf"); font-weight: 400; }
  /* One family per weight: Word and LibreOffice only know normal and bold, so
     Medium (500) and SemiBold (600) are requested by name with font-weight normal. */
  @font-face { font-family: "Montserrat Medium"; src: url("brand://fonts/Montserrat-Medium.ttf"); }
  @font-face { font-family: "Montserrat SemiBold"; src: url("brand://fonts/Montserrat-SemiBold.ttf"); }
  @font-face { font-family: "Montserrat"; src: url("brand://fonts/Montserrat-Bold.ttf"); font-weight: 700; }
  @page {
    size: Letter landscape; margin: 0.6in 0.6in 0.8in; background: #010101;
    @bottom-center { content: "© Orage AI Agency · Edmond, Oklahoma · orage.agency"; font-family: "Montserrat Medium", Arial, sans-serif; font-size: 8pt; color: #B68039; }
  }
  html, body { background: #010101; }
  body { font-family: "Montserrat Medium", Helvetica, Arial, sans-serif; font-size: 9.5pt; color: #FEFEFE; margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  header { display: flex; align-items: center; gap: 12pt; padding: 6pt 0; }
  header img { width: 40px; height: 40px; }
  header span, caption { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; text-transform: uppercase; }
  header span { font-size: 18pt; letter-spacing: 4px; color: #B68039; }
  /* Compact header: small emblem and wordmark, right-aligned. */
  header.compact { justify-content: flex-end; gap: 6pt; padding: 4pt 0; }
  header.compact img { width: 22px; height: 22px; }
  header.compact span { font-size: 11pt; letter-spacing: 3px; }
  /* % change tiles (PDF only). */
  .tiles { display: flex; gap: 8pt; margin: 14pt 0 0; }
  .tile { flex: 1; background: #212121; border: 1px solid #543C1C; border-radius: 6px; padding: 8pt 10pt; }
  .tile .label { font-size: 8.5pt; color: #DEDEDE; margin: 0; }
  .tile .pct { font-family: "Bebas Neue", Impact, sans-serif; font-size: 26pt; letter-spacing: 2px; color: #B68039; margin: 2pt 0; line-height: 1; }
  .tile .from { font-size: 8.5pt; color: #DEDEDE; margin: 0; }
  td.pct { font-family: "Montserrat", Helvetica, Arial, sans-serif; font-weight: 700; color: #B68039; }
  table { width: 100%; border-collapse: collapse; margin: 14pt 0; }
  caption { font-size: 18pt; letter-spacing: 3px; color: #E4AF7A; text-align: left; padding-bottom: 3pt; border-bottom: 2px solid #B68039; margin-bottom: 6pt; }
  th { background: #212121; color: #E4AF7A; font-family: "Montserrat", Helvetica, Arial, sans-serif; font-weight: 700; text-align: left; padding: 5pt 7pt; }
  td { background: #151515; border-bottom: 1px solid #543C1C; padding: 5pt 7pt; }
  tr.total td { font-family: "Montserrat", Helvetica, Arial, sans-serif; font-weight: 700; color: #DEDEDE; border-top: 2px solid #B68039; }
  .key { font-family: "Montserrat", Helvetica, Arial, sans-serif; color: #B68039; font-weight: 700; }
  .note { font-size: 8.5pt; color: #DEDEDE; margin: 4pt 0 0; }
</style>
</head>
<body>
  <header class="compact"><img src="brand://logo/logo.png" alt="Orage AI Agency"><span>Orage AI Agency</span></header>

  <!-- Each top-level <table> = one XLSX sheet / one CSV file. <caption> titles it in the PDF. -->
  <table data-sheet="Sales">
    <caption>Sales</caption>
    <tr><th>Product</th><th>Units</th><th>Price</th><th>Total</th><th>Code</th></tr>
    <tr><td>Product A</td><td>12</td><td>19.90</td><td data-formula="=B2*C2">238.80</td><td data-type="text">007</td></tr>
    <tr><td>Product B</td><td>5</td><td>14.50</td><td data-formula="=B3*C3">72.50</td><td data-type="text">012</td></tr>
    <tr class="total"><td>Total</td><td data-formula="=SUM(B2:B3)">17</td><td></td><td class="key" data-formula="=SUM(D2:D3)">311.30</td><td></td></tr>
  </table>

  <table data-sheet="Notes">
    <caption>Notes</caption>
    <tr><th>Date</th><th>Note</th></tr>
    <tr><td data-type="text">2026-01-15</td><td>First line<br>Second line</td></tr>
  </table>
  <p class="note">Text outside the tables appears only in the PDF.</p>
</body>
</html>
